<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>DCM Jhagadia Coal Source Mapping Dashboard</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <link rel="stylesheet"
          href="css/style.css"/>
</head>

<body>

<div class="sidebar">

    <h2>DCM Jhagadia Coal Dashboard</h2>

    <select id="subsidiaryFilter">
        <option value="ALL">All Subsidiaries</option>
        <option value="NCL">NCL</option>
        <option value="SECL">SECL</option>
        <option value="CCL">CCL</option>
        <option value="WCL">WCL</option>
    </select>

    <div id="stats">
        <h3>Mine Count</h3>
        <p id="mineCount">0</p>
    </div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="js/app.js"></script>

</body>
</html>
